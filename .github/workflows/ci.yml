name: CI

on:
  push:
    branches: [main, develop, imran-dev]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: voice_agent
          POSTGRES_PASSWORD: voice_agent_dev
          POSTGRES_DB: voice_agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U voice_agent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      PYTHONPATH: packages:.
      DATABASE_URL: postgresql+asyncpg://voice_agent:voice_agent_dev@localhost:5432/voice_agent
      REDIS_URL: redis://localhost:6379/0
      ENFORCE_STORE_HOURS: "false"
      INTEGRATION_DB: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: |
          python -m ruff check packages apps tests
          python -m ruff format --check packages apps tests
          python -m mypy packages/order_engine

      - name: Migrate
        run: python -m alembic upgrade head

      - name: Test
        run: python -m pytest tests/ -v --tb=short
